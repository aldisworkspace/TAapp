<title>Twin Angels</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-width column. Vertical snap feed of posts; each post is a horizontal carousel.
   Cover slides put a full-bleed "frame" in the sphere colour on top (the graphic), text below. Dark world by choice. */
:root {
  color-scheme: dark;
  --bg: #07080C;
  --panel: #12141B;
  --panel-2: #1A1D26;
  --line: rgba(230, 234, 245, 0.10);
  --text: #F2F3F7;
  --soft: #C3C8D4;
  --muted: #9298A8;
  --ink: #07080C;
  --good: #3DDC97;
  --bad: #FF6B5E;
  --gold: #FFC857;

  --s-politics: #FF7A6B;
  --s-intl: #7B93FF;
  --s-economy: #FFB547;
  --s-finance: #3DDC97;
  --s-tech: #AE9CFF;
  --s-energy: #F2E14C;
  --s-arts: #FF8FCF;
  --s-media: #4FE0D0;

  --f: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --hud-h: 48px;
  --tab-h: 56px;
  --ease: cubic-bezier(.22, 1, .36, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--f); font-size: 16px; line-height: 1.42; overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; text-align: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 12px; }
a { color: inherit; }
svg text { dominant-baseline: middle; }

.stage { position: relative; height: 100%; max-width: 480px; margin: 0 auto; display: grid; grid-template-rows: var(--hud-h) 1fr var(--tab-h); background: var(--bg); overflow: hidden; }
@media (min-width: 600px) { body { background: #0C0E14; } .stage { border-inline: 1px solid var(--line); } }

/* HUD */
.hud { display: flex; align-items: center; justify-content: space-between; gap: 10px; z-index: 6; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bg); }
.brand { font-weight: 900; font-size: .95rem; letter-spacing: -.01em; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
.brand svg { width: 20px; height: 20px; }
.hud-r { display: flex; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 99px; background: var(--panel); font-weight: 700; font-size: .82rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill svg { width: 15px; height: 15px; }
.pill.flame { color: var(--gold); }
.pill.flame.cold { color: var(--muted); }
.goal { display: flex; gap: 3px; align-items: center; padding: 0 10px; }
.goal i { width: 6px; height: 14px; border-radius: 3px; background: #2A2E3A; display: block; transition: background .3s; }
.goal i.on { background: var(--gold); }
.pop { animation: pop .45s var(--ease); }
@keyframes pop { 40% { transform: scale(1.16); } }

.view { position: relative; overflow: hidden; min-height: 0; }

/* Feed */
.feed { height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; }
.feed::-webkit-scrollbar, .slides::-webkit-scrollbar { display: none; }
.post { --c: var(--s-tech); position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden; background: var(--bg); }
.slides { display: flex; height: 100%; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; }
.slide { flex: 0 0 100%; height: 100%; scroll-snap-align: start; overflow-y: auto; position: relative; display: flex; flex-direction: column; }
.slide > * { min-width: 0; }
.pad { padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.body { display: flex; flex-direction: column; gap: 14px; padding-block: 36px 28px; flex: 1; }
.segs { position: absolute; top: 10px; left: max(14px, env(safe-area-inset-left, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); display: flex; gap: 4px; z-index: 3; pointer-events: none; }
.segs i { flex: 1; height: 3px; border-radius: 3px; background: rgba(7, 8, 12, .28); overflow: hidden; display: block; }
.segs i::after { content: ""; display: block; height: 100%; width: 0; background: var(--ink); transition: width .35s var(--ease); }
.segs i.on::after { width: 100%; }
.segs.dark i { background: rgba(242, 243, 247, .16); }
.segs.dark i::after { background: var(--c); }

/* Cover frame */
.frame { position: relative; flex: none; height: 46%; min-height: 250px; background: var(--c); color: var(--ink); overflow: hidden; }
.frame svg.vis { position: absolute; inset: 34px 0 0 0; width: 100%; height: calc(100% - 34px); }
.frame .tagrow { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); right: max(18px, env(safe-area-inset-right, 0px)); top: 24px; display: flex; justify-content: space-between; gap: 8px; font-weight: 700; font-size: .78rem; z-index: 2; }
.frame .tag { background: rgba(7, 8, 12, .14); padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
.cover-text { display: flex; flex-direction: column; gap: 10px; padding-block: 18px 78px; flex: 1; padding-right: max(78px, env(safe-area-inset-right, 0px)); }
.kicker { font-family: var(--mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--c); font-weight: 600; display: flex; gap: 10px; flex-wrap: wrap; }
.kicker .ok { color: var(--good); }
.h1 { font-weight: 900; font-size: clamp(1.5rem, 6.8vw, 1.95rem); line-height: 1.06; letter-spacing: -.02em; text-wrap: balance; margin: 0; }
.lede { color: var(--soft); font-size: 1.02rem; margin: 0; }
.hint { margin-top: auto; display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .85rem; font-weight: 500; }
.hint svg { width: 16px; height: 16px; animation: nudge 1.8s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(5px); } }

.rail { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 26px; display: flex; flex-direction: column; gap: 14px; z-index: 3; }
.rail button { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .68rem; font-weight: 600; color: var(--soft); width: 56px; }
.rail span.ic { width: 46px; height: 46px; border-radius: 50%; background: var(--panel-2); display: grid; place-items: center; color: var(--text); transition: transform .15s var(--ease); }
.rail button:active span.ic { transform: scale(.92); }
.rail svg { width: 21px; height: 21px; }

/* Section header inside slides */
.sh { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.sh h3 { margin: 0; font-weight: 900; font-size: 1.35rem; letter-spacing: -.01em; }
.sh small { font-family: var(--mono); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--c); font-weight: 600; white-space: nowrap; }

/* Facts */
.facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.facts li { background: var(--panel); border-radius: 16px; padding: 13px 15px; font-size: 1rem; line-height: 1.42; }
.ref { font-family: var(--mono); font-size: .7rem; font-weight: 600; color: var(--c); vertical-align: 3px; margin-left: 3px; padding: 2px 4px; border-radius: 6px; background: rgba(255,255,255,.06); }
.srcbtn { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; min-height: 44px; padding: 0 14px; border-radius: 99px; background: var(--panel); font-weight: 600; font-size: .85rem; color: var(--soft); }
.srcbtn svg { width: 15px; height: 15px; }

/* Mechanism diagram */
.chain { display: flex; flex-direction: column; align-items: stretch; }
.nd { border-radius: 16px; padding: 12px 14px; background: var(--panel); font-weight: 500; line-height: 1.32; transition: background .3s; display: grid; gap: 4px; }

.nd.now { background: var(--c); color: var(--ink); }
.nd.inf { background: transparent; border: 1.5px dashed rgba(242, 243, 247, .28); }
.nd.inf.now { border-color: var(--c); color: var(--text); background: color-mix(in srgb, var(--c) 14%, transparent); }
.nd .kd { font-family: var(--mono); font-size: .64rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; opacity: .7; }
.arrow { height: 22px; display: flex; justify-content: center; }

.arrow svg { width: 14px; height: 22px; color: var(--c); }
.arrow.dash svg { color: var(--muted); }
.guess { display: grid; gap: 8px; padding: 14px; border-radius: 18px; border: 1.5px dashed var(--c); }
.guess b { font-weight: 800; }
.guess small { color: var(--muted); font-size: .82rem; }
.chip { text-align: left; padding: 11px 13px; border-radius: 13px; background: var(--panel-2); font-weight: 500; line-height: 1.3; transition: background .2s, transform .15s; }
.chip:active { transform: scale(.985); }
.chip.right { background: var(--good); color: var(--ink); }
.chip.wrong { background: color-mix(in srgb, var(--bad) 30%, var(--panel)); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border-radius: 16px; background: var(--c); color: var(--ink); font-weight: 800; transition: transform .15s var(--ease); }
.btn:active { transform: scale(.97); }
.btn.ghost { background: var(--panel-2); color: var(--text); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1 1 0; }

/* Terms */
.terms { display: grid; gap: 10px; }
.term { width: 100%; padding: 14px 15px; border-radius: 16px; background: var(--panel); display: grid; gap: 6px; transition: background .25s; }
.term .tt { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-weight: 800; font-size: 1.08rem; }
.term .tt span { font-family: var(--mono); font-size: .64rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.term p { margin: 0; color: var(--soft); display: none; }
.term.open { background: color-mix(in srgb, var(--c) 16%, var(--panel)); }
.term.open p { display: block; }
.term.open .tt span { color: var(--c); }

.nd:not(.in), .arrow:not(.in) { display: none; }
.nd.in { animation: rise .45s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

/* Ripple + pattern */
.ripple { width: 100%; height: auto; display: block; }
.lk { display: grid; grid-template-columns: 10px 1fr; gap: 10px; align-items: start; font-size: .96rem; }
.lk i { width: 10px; height: 10px; border-radius: 3px; transform: rotate(45deg); margin-top: 6px; display: block; }
.lk b { font-weight: 700; }
.card { border-radius: 18px; padding: 15px; background: var(--panel); display: grid; gap: 6px; }
.card .lab { font-family: var(--mono); font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; color: var(--c); }
.card h4 { margin: 0; font-weight: 800; font-size: 1.08rem; }
.card p { margin: 0; color: var(--soft); }
.card.acc { background: var(--c); color: var(--ink); }
.card.acc .lab { color: var(--ink); opacity: .7; }
.card.acc p { color: var(--ink); }

/* Quiz */
.q { font-weight: 800; font-size: 1.22rem; line-height: 1.25; text-wrap: balance; margin: 0; }
.opts { display: grid; gap: 9px; }
.opt { min-height: 52px; padding: 12px 14px; border-radius: 15px; background: var(--panel); display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center; line-height: 1.32; transition: background .2s, transform .15s; }
.opt:active { transform: scale(.985); }
.opt .k { width: 28px; height: 28px; border-radius: 9px; background: var(--panel-2); display: grid; place-items: center; font-family: var(--mono); font-size: .75rem; font-weight: 600; color: var(--muted); }
.opt.right { background: color-mix(in srgb, var(--good) 22%, var(--panel)); }
.opt.right .k { background: var(--good); color: var(--ink); }
.opt.wrong { background: color-mix(in srgb, var(--bad) 22%, var(--panel)); }
.opt.wrong .k { background: var(--bad); color: var(--ink); }
.opts.locked .opt { pointer-events: none; }
.why { border-radius: 16px; padding: 13px 15px; background: var(--panel-2); line-height: 1.42; }
.why b { display: block; font-weight: 800; margin-bottom: 3px; }
.why.ok b { color: var(--good); }
.why.no b { color: var(--bad); }
.predict { border-radius: 18px; padding: 15px; border: 1.5px dashed rgba(242,243,247,.22); display: grid; gap: 10px; }
.predict small { font-family: var(--mono); font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.predict p { margin: 0; font-weight: 600; }
.note { color: var(--muted); font-size: .88rem; line-height: 1.45; margin: 0; }

/* Special posts */
.hero { font-weight: 900; font-size: clamp(2rem, 9vw, 2.6rem); line-height: 1.02; letter-spacing: -.025em; margin: 0; text-wrap: balance; }
.mosaic { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.mosaic i { aspect-ratio: 1; border-radius: 12px; display: block; }
.big-term { font-weight: 900; font-size: clamp(2rem, 9.5vw, 2.7rem); line-height: 1.02; letter-spacing: -.02em; overflow-wrap: anywhere; margin: 0; }
.ring { width: 140px; height: 140px; }
.gen-out { white-space: pre-wrap; color: var(--soft); font-size: .9rem; max-height: 9em; overflow: hidden; }

/* Toast + rewards */
.toast { position: absolute; left: 50%; top: calc(var(--hud-h) + 14px); transform: translate(-50%, -16px); opacity: 0; z-index: 30; background: var(--text); color: var(--ink); padding: 10px 16px; border-radius: 99px; font-weight: 700; font-size: .9rem; pointer-events: none; transition: opacity .3s, transform .4s var(--ease); white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.float { position: fixed; z-index: 40; pointer-events: none; font-weight: 900; color: var(--gold); font-size: 1.15rem; animation: up 1s var(--ease) forwards; text-shadow: 0 2px 10px rgba(0,0,0,.7); }
@keyframes up { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -70px) scale(1.2); } }
.spark { position: fixed; z-index: 39; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; animation: spark .8s var(--ease) forwards; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) rotate(220deg); opacity: 0; } }

/* Sheet */
.scrim { position: absolute; inset: 0; background: rgba(3, 4, 8, .6); z-index: 50; opacity: 0; transition: opacity .25s; }
.scrim.on { opacity: 1; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 51; background: var(--panel); border-radius: 24px 24px 0 0; max-height: 80%; overflow-y: auto; padding-block: 10px calc(24px + env(safe-area-inset-bottom, 0px)); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); transform: translateY(100%); transition: transform .35s var(--ease); }
.sheet.on { transform: none; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 14px; }
.sheet h3 { font-weight: 900; font-size: 1.2rem; margin: 0 0 10px; }
.src { display: grid; gap: 3px; padding: 12px 0; border-top: 1px solid var(--line); }
.src a { font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
.src a:hover { text-decoration: underline; }
.src span { font-family: var(--mono); font-size: .72rem; color: var(--muted); }

/* Tabs */
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bg); border-top: 1px solid var(--line); z-index: 6; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-size: .7rem; font-weight: 600; min-height: 48px; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--text); }

/* Panels */
.panel { height: 100%; overflow-y: auto; padding-block: 18px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; }
.panel > * { flex-shrink: 0; min-width: 0; }
.panel h2 { font-weight: 900; font-size: 1.6rem; letter-spacing: -.02em; margin: 0; }
.panel h5 { font-family: var(--mono); font-weight: 600; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.graph { border-radius: 20px; background: var(--panel); overflow: hidden; aspect-ratio: 1; max-width: 100%; }
.graph canvas { width: 100%; height: 100%; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: .8rem; color: var(--soft); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; border-radius: 2px; transform: rotate(45deg); display: block; }
.list { display: grid; gap: 8px; }
.li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 14px; background: var(--panel); font-size: .92rem; }
.li .nm { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.li .nm i { width: 8px; height: 8px; border-radius: 2px; transform: rotate(45deg); display: inline-block; }
.li b { font-family: var(--mono); color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.empty { padding: 18px; border-radius: 16px; border: 1.5px dashed var(--line); color: var(--muted); }
.lvl { border-radius: 22px; padding: 20px; background: linear-gradient(140deg, #2A2140, #141722 60%); display: grid; gap: 12px; }
.lvl .rk { font-weight: 900; font-size: 1.6rem; letter-spacing: -.02em; }
.lvl .sm { font-family: var(--mono); font-size: .75rem; color: var(--muted); font-weight: 600; }
.bar { height: 10px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--gold); width: 0; transition: width .8s var(--ease); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { padding: 12px; border-radius: 16px; background: var(--panel); display: grid; gap: 2px; }
.stat b { font-weight: 900; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: .75rem; line-height: 1.25; }
.cal { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 5px; }
.cal i { aspect-ratio: 1; border-radius: 5px; background: var(--panel-2); display: block; }
.cal i.part { background: color-mix(in srgb, var(--gold) 40%, var(--panel-2)); }
.cal i.full { background: var(--gold); }
.cal i.today { outline: 1.5px solid var(--text); outline-offset: 1px; }
.mrow { display: grid; grid-template-columns: 108px minmax(0, 1fr) 46px; gap: 10px; align-items: center; font-size: .86rem; }
.mrow .bar { height: 8px; }
.mrow .bar > i { background: var(--c); }
.mrow b { font-family: var(--mono); font-weight: 600; font-size: .75rem; color: var(--muted); text-align: right; }
.tech { display: grid; gap: 8px; }
.tech div { padding: 12px 14px; border-radius: 14px; background: var(--panel); }
.tech b { display: block; font-weight: 800; margin-bottom: 2px; }
.tech span { color: var(--soft); font-size: .9rem; }
.sync { font-family: var(--mono); font-size: .72rem; color: var(--muted); }

/* v3: glossary, numbers, next, primer, actors, hops, explain */
.gl { display: inline; padding: 0; font: inherit; color: inherit; text-decoration: underline dotted; text-decoration-color: var(--c, var(--soft)); text-decoration-thickness: 2px; text-underline-offset: 3px; cursor: help; }
.gl:active { background: color-mix(in srgb, var(--c) 22%, transparent); border-radius: 4px; }
.num { font-weight: 800; color: var(--c); font-variant-numeric: tabular-nums; }
.body { padding-bottom: 84px; }
.nextfab { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 4; width: 48px; height: 48px; border-radius: 50%; background: var(--panel-2); color: var(--text); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.45); transition: transform .15s var(--ease); }
.nextfab:active { transform: translateX(-50%) scale(.92); }
.nextfab svg { width: 24px; height: 24px; animation: bob 2.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(3px); } }
.next-cta { width: 100%; }
.primer { display: grid; gap: 12px; }
.pcard { border-radius: 18px; padding: 16px; background: var(--panel); display: grid; gap: 8px; border-left: 4px solid var(--c); }
.pcard b { font-weight: 800; font-size: 1.08rem; line-height: 1.25; }
.pcard p { margin: 0; color: var(--soft); line-height: 1.5; }
.actwrap { display: grid; gap: 10px; }
.actors { width: 100%; height: auto; display: block; background: var(--panel); border-radius: 20px; }
.flows { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.flows li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; font-size: .92rem; line-height: 1.35; color: var(--soft); }
.flows .fn { width: 22px; height: 22px; border-radius: 50%; background: var(--text); color: var(--ink); font-weight: 900; font-size: .75rem; display: grid; place-items: center; }
.flows b { color: var(--text); font-weight: 700; }

<script>
(() => {
'use strict';

/* ============ constants ============ */
const SP = { politics: 'Политика', intl: 'Международка', economy: 'Экономика', finance: 'Финансы', tech: 'Технологии', energy: 'Энергетика', arts: 'Искусство', media: 'Медиа' };
const KEYS = Object.keys(SP);
const CS = getComputedStyle(document.documentElement);
const COL = {}; for (const k of KEYS) COL[k] = CS.getPropertyValue('--s-' + k).trim();
const INK = '#07080C';
const RANKS = [[1, 'Наблюдатель'], [3, 'Читатель'], [5, 'Аналитик'], [8, 'Стратег'], [12, 'Архитектор систем'], [17, 'Twin Angel']];
const BOX_DAYS = [0, 1, 3, 7, 14, 30, 60];
const DAILY_GOAL = 5;
const LS = 'ta.progress.v2';
const LS_GEN = 'ta.generated.v1';
const HAS_CLAUDE = !!(window.claude && window.claude.use);
const KIND = { concept: 'Как это устроено', pattern: 'Паттерн', player: 'Ключевой игрок' };

/* ============ utils ============ */
const $ = (s, r = document) => r.querySelector(s);

function s(tag, a, ...kids) { const el = document.createElementNS(NS, tag); if (a) for (const k in a) if (a[k] != null) el.setAttribute(k, a[k]); for (const c of kids.flat()) { if (c == null) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); } return el; }

const I_NEXT = '<path d="M5 12h13M13 6l6 6-6 6"/>';
const I_CHAIN = '<path d="M7 4v4M7 16v4M17 10v4M7 8a2 2 0 1 0 0 0M7 12h10M17 14a2 2 0 1 0 0 0"/>';
const I_Q = '<path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 18h.01"/>';
const I_BOOK = '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5ZM8 7h7"/>';
const ARROW = '<svg viewBox="0 0 14 22" aria-hidden="true"><path d="M7 1v17M2 13l5 6 5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function today() { return ymd(new Date()); }
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(x, n) { const [y, m, d] = x.split('-').map(Number); return ymd(new Date(y, m - 1, d + n)); }
function fmtDate(x) { if (!x) return ''; const [y, m, d] = x.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }); }

const col = k => COL[k] || COL.tech;
const name = k => SP[k] || k;
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fmtNum(v) { return Number(v).toLocaleString('ru-RU', { maximumFractionDigits: 2 }); }
function levelOf(xp) { const lv = Math.floor(Math.sqrt(xp / 50)) + 1; const lo = 50 * (lv - 1) ** 2, hi = 50 * lv ** 2; return { lv, hi, pct: (xp - lo) / (hi - lo) }; }
function rankOf(lv) { let r = RANKS[0][1]; for (const [n, nm] of RANKS) if (lv >= n) r = nm; return r; }

/* ============ state ============ */
function blank() { return { v: 2, updatedAt: 0, xp: 0, bestCombo: 0, streak: 0, lastGoalDay: null, days: {}, stories: {}, lib: {}, terms: {}, spheres: {}, techniques: {} }; }
let P = blank();
try { const raw = localStorage.getItem(LS) || localStorage.getItem('ta.progress.v1'); if (raw) P = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
let GEN = [];
try { GEN = JSON.parse(localStorage.getItem(LS_GEN) || '[]'); } catch (e) {}
let combo = 0, dbApi = null, progRef = null, genRef = null, saveT = null, saving = false, dirty = false, sync = 'local';
let sampleFn = null;

const day = (d = today()) => (P.days[d] ||= { q: 0, ok: 0, seen: 0 });
const st = id => (P.stories[id] ||= {});
const lb = id => (P.lib[id] ||= {});
function tech(k) { P.techniques[k] = (P.techniques[k] || 0) + 1; }
function touch() { P.updatedAt = Date.now(); try { localStorage.setItem(LS, JSON.stringify(P)); } catch (e) {} dirty = true; clearTimeout(saveT); saveT = setTimeout(flush, 1200); }
async function flush() {
  if (!progRef || saving || !dirty) return; saving = true; dirty = false;
  try { await progRef.set(JSON.parse(JSON.stringify(P))); sync = 'cloud'; } catch (e) { dirty = true; sync = e && e.code === 'invalid_argument' ? 'readonly' : 'local'; }

}

async function connect() {
  try {
    if (!window.claude || !window.claude.use) return;
    window.claude.use('sample').then(f => { sampleFn = f || null; }).catch(() => {});
    const db = await window.claude.use('db'); if (!db) return; dbApi = db;
    progRef = db.doc('state/progress'); genRef = db.doc('state/generated');
    const [ps, gs] = await Promise.all([progRef.get(), genRef.get()]);
    if (ps.exists) {
      const r = ps.data();
      if ((r.updatedAt || 0) > (P.updatedAt || 0)) { P = Object.assign(blank(), JSON.parse(JSON.stringify(r))); try { localStorage.setItem(LS, JSON.stringify(P)); } catch (e) {} hud(); }

    if (gs.exists && Array.isArray(gs.data().cards) && gs.data().cards.length > GEN.length) { GEN = gs.data().cards.slice(); try { localStorage.setItem(LS_GEN, JSON.stringify(GEN)); } catch (e) {} }
    sync = 'cloud'; if (dirty) flush();
  } catch (e) { sync = 'local'; }
}

/* ============ rewards ============ */
function award(n, at, label) { P.xp += n; touch(); hud(true); if (at) floatText('+' + n + (label ? ' ' + label : ''), at); }
function floatText(t, at) { const r = at.getBoundingClientRect(); const el = h('div', { class: 'float', style: `left:${r.left + r.width / 2}px;top:${r.top}px` }, t); document.body.append(el); setTimeout(() => el.remove(), 1000); }

  for (let i = 0; i < 18; i++) { const a = Math.random() * 6.283, d = 50 + Math.random() * 90; const el = h('i', { class: 'spark', style: `left:${cx}px;top:${cy}px;background:${cs[i % 3]};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px` }); document.body.append(el); setTimeout(() => el.remove(), 850); }
}
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2400); }
function goalTarget() { return DAILY_GOAL; }
function liveStreak() { const d = today(); return (P.lastGoalDay === d || P.lastGoalDay === addDays(d, -1)) ? P.streak : 0; }
function answered(ok, sphere, el, base, label) {
  const d = day(); d.q++; if (ok) d.ok++;
  const sp = (P.spheres[sphere] ||= { n: 0, ok: 0 }); sp.n++; if (ok) sp.ok++;
  if (ok) { combo++; P.bestCombo = Math.max(P.bestCombo, combo); const m = Math.min(3, 1 + .5 * (combo - 1)); award(Math.round(base * m), el, (label || 'XP') + (combo > 1 ? ' ×' + m : '')); burst(el, col(sphere)); if (combo === 3 || combo === 5 || combo === 10) toast('Серия верных: ' + combo + '. Множитель ×' + Math.min(3, 1 + .5 * (combo - 1))); }
  else { combo = 0; touch(); hud(); }
  if (d.q >= goalTarget() && P.lastGoalDay !== today()) {
    P.streak = P.lastGoalDay === addDays(today(), -1) ? P.streak + 1 : 1; P.lastGoalDay = today(); touch(); hud(true);
    setTimeout(() => toast('Цель дня закрыта. Серия: ' + P.streak + ' ' + plural(P.streak, 'день', 'дня', 'дней')), 600);
  }
}

/* ============ HUD ============ */
function hud(p) {
  $('#xpN').textContent = P.xp;
  if (p) { const c = $('#xpPill'); c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); }
  $('#streakN').textContent = liveStreak(); $('#streak').classList.toggle('cold', P.lastGoalDay !== today());
  const g = $('#goal'); g.textContent = ''; const t = goalTarget(), q = day().q;
  for (let i = 0; i < t; i++) g.append(h('i', { class: i < q ? 'on' : '' }));
  g.setAttribute('aria-label', 'Цель дня: ' + Math.min(q, t) + ' из ' + t);
}

/* ============ sheet ============ */
function openSheet(title, body) { const b = $('#sheetBody'); b.textContent = ''; b.append(h('h3', null, title), body); const sc = $('#scrim'), sh = $('#sheet'); sc.hidden = false; sh.hidden = false; requestAnimationFrame(() => { sc.classList.add('on'); sh.classList.add('on'); }); }
function closeSheet() { const sc = $('#scrim'), sh = $('#sheet'); sc.classList.remove('on'); sh.classList.remove('on'); setTimeout(() => { sc.hidden = true; sh.hidden = true; }, 350); }
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
function sourcesSheet(item, generated) {
  openSheet('Источники', h('div', null,
    ...(item.sources || []).map((x, i) => h('div', { class: 'src' }, h('span', null, '[' + (i + 1) + '] ' + (x.publisher || '') + (x.date ? ' · ' + fmtDate(x.date) : '')), h('a', { href: x.url, target: '_blank', rel: 'noopener' }, x.title || x.url))),
    !(item.sources || []).length ? h('p', { class: 'note' }, 'У этой карточки нет ссылок.') : null,
    h('p', { class: 'note', style: 'margin-top:12px' }, generated ? 'Карточку написал Claude по запросу из приложения. Ссылки не проверялись вручную: относись к ней как к объяснению, а не к источнику.' : 'Сплошная рамка в механизме — то, что прямо сказано в источниках. Пунктир — вывод из этих фактов.')));
}

/* ============ visuals (drawn in ink on the sphere colour) ============ */
function visSvg(v, item) {

  const svg = s('svg', { class: 'vis', viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'xMidYMid meet', role: 'img', 'aria-label': (v && v.title) || item.headline || item.title || '' });

    });

  }

    svg.append(title(v.title));
    const a = +v.from.value, b = +v.to.value, up = b >= a, u = v.unit || '';
    svg.append(s('text', { x: L, y: 95, 'font-family': 'Golos Text', 'font-size': 52, 'font-weight': 900, fill: INK, opacity: .38 }, fmtNum(a) + (u === '%' ? '%' : '')));
    svg.append(s('text', { x: L, y: 138, 'font-family': 'Golos Text', 'font-size': 12.5, 'font-weight': 600, fill: INK, opacity: .7 }, (v.from.label || '').slice(0, 22)));
    svg.append(s('path', { d: `M168 90 h40 m-12 -12 l12 12 l-12 12`, fill: 'none', stroke: INK, 'stroke-width': 4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', class: 'draw', pathLength: 1 }));

  for (const n of nodes) if (P.terms[n.id]) for (const k of n.sp) { ctx.strokeStyle = col(k) + '55'; ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(A[k].x, A[k].y); ctx.stroke(); }
  for (const k of KEYS) { const a = A[k]; ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(Math.PI / 4); ctx.fillStyle = col(k); ctx.fillRect(-8, -8, 16, 16); ctx.restore(); }
  ctx.font = '600 11px "Golos Text", system-ui';
  const labels = [];
  for (const n of nodes) { const m = P.terms[n.id]; ctx.globalAlpha = m ? .45 + (m.box || 1) / 6 * .55 : .22; ctx.fillStyle = col(n.primary); ctx.beginPath(); ctx.arc(n.x, n.y, m ? 5 : 3, 0, 6.283); ctx.fill(); if (m) labels.push(n); }
  ctx.globalAlpha = 1; ctx.fillStyle = '#F2F3F7';
  for (const n of labels) { const t = n.term.length > 20 ? n.term.slice(0, 19) + '…' : n.term, tw = ctx.measureText(t).width; let lx = n.x + 8; if (lx + tw > W - 4) lx = n.x - 8 - tw; ctx.fillText(t, lx, n.y + 4); }
  ctx.font = '700 10px "Golos Text", system-ui';
  for (const k of KEYS) { const a = A[k], t = name(k), tw = ctx.measureText(t).width; ctx.fillStyle = col(k); ctx.fillText(t, Math.max(4, Math.min(W - tw - 4, a.x - tw / 2)), a.y < cy ? a.y - 14 : a.y + 22); }
  cv.onclick = e => { const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top; let best = null, bd = 576; for (const n of nodes) { const d = (n.x - x) ** 2 + (n.y - y) ** 2; if (d < bd) { bd = d; best = n; } } if (!best) return; const m = P.terms[best.id];
    openSheet(best.term, h('div', { style: 'display:grid;gap:12px' }, h('p', { style: 'margin:0' }, best.def), h('p', { class: 'note' }, m ? 'В колоде, уровень ' + (m.box || 1) + ' из 6. Повтор: ' + fmtDate(m.due) + '.' : 'Ещё не в колоде: открой его в истории или карточке.'), h('div', null, h('h5', null, 'Встречается в'), ...best.from.slice(0, 6).map(f => h('p', { class: 'note', style: 'margin-bottom:6px' }, '• ' + f))))); };
}

/* ============ progress ============ */
function renderMe() {
  const el = $('#me'); el.textContent = '';
  const L = levelOf(P.xp), bar = h('i'); setTimeout(() => { bar.style.width = Math.round(L.pct * 100) + '%'; }, 40);
  const totQ = Object.values(P.days).reduce((a, d) => a + d.q, 0), totOk = Object.values(P.days).reduce((a, d) => a + d.ok, 0);
  el.append(h('div', { class: 'lvl' }, h('div', { class: 'sm' }, 'Уровень ' + L.lv + ' · ' + P.xp + ' / ' + L.hi + ' XP'), h('div', { class: 'rk' }, rankOf(L.lv)), h('div', { class: 'bar' }, bar), h('div', { class: 'note' }, 'Следующее звание: ' + nextRank(L.lv))));
  el.append(h('div', { class: 'stats' }, stat(liveStreak(), plural(liveStreak(), 'день', 'дня', 'дней') + ' подряд'), stat(totQ ? Math.round(100 * totOk / totQ) + '%' : '—', 'точность ответов'), stat(Object.keys(P.terms).length, 'терминов в колоде')));
  const cal = h('div', { class: 'cal' }); for (let i = 13; i >= 0; i--) { const d = addDays(today(), -i), dd = P.days[d]; cal.append(h('i', { class: (dd && dd.q >= goalTarget() ? 'full' : dd && (dd.q || dd.seen) ? 'part' : '') + (i === 0 ? ' today' : ''), title: d })); }
  el.append(h('div', null, h('h5', null, 'Последние 14 дней'), cal));
  const m = h('div', { style: 'display:grid;gap:10px' });
  for (const k of KEYS) { const x = P.spheres[k] || { n: 0, ok: 0 }, b = h('i'); setTimeout(() => { b.style.width = (x.n ? Math.round(100 * x.ok / x.n) : 0) + '%'; }, 40); m.append(h('div', { class: 'mrow', style: '--c:' + col(k) }, h('span', null, name(k)), h('div', { class: 'bar' }, b), h('b', null, x.n ? x.ok + '/' + x.n : '—'))); }
  el.append(h('div', null, h('h5', null, 'Понимание по сферам'), m));
  const T = P.techniques;
  el.append(h('div', null, h('h5', null, 'Как приложение помогает запоминать'), h('div', { class: 'tech' },
    techRow('Вспоминание вместо перечитывания', 'Вопрос в конце каждой истории и карточки. Попытка вспомнить закрепляет сильнее, чем повторное чтение.', T.retrieval),
    techRow('Интервальные повторения', 'Открытые термины возвращаются через 1, 3, 7, 14, 30 и 60 дней. Ошибся — термин начинает круг заново.', T.spaced),
    techRow('Эффект генерации', '«Что будет дальше?» в механизме: сначала угадываешь звено сам, потом видишь ответ.', T.generation),
    techRow('Чередование', 'Сферы перемешаны, а между историями идут задания «узнай паттерн» и обратное вспоминание.', T.interleave),
    techRow('Двойное кодирование', 'Каждая история — схема плюс текст: цифры, цепочки и связи видны глазами.', null),
    techRow('Уточнение через примеры', '«Где ещё так бывает» и примеры из истории привязывают новое к уже известному.', null),
    techRow('Объяснение своими словами', 'После вопроса пишешь, как понял, — Claude сверяет с ключевыми мыслями и показывает, чего не хватает.', T.selfexplain),
    techRow('Вопросы по ходу', 'Кнопка «Спросить» на обложке: Claude объясняет проще, на примере или через Казахстан.', T.ask),
    techRow('Прогнозы', 'Ставишь да или нет на будущее событие; при /brief прогноз сверяется с реальностью.', T.prediction))));
  const preds = allStories().filter(x => x.predict && (P.stories[x.id] || {}).pred);
  el.append(h('div', null, h('h5', null, 'Твои прогнозы'), preds.length ? h('div', { class: 'list' }, preds.map(x => { const v = VERDICTS[x.id], mine = P.stories[x.id].pred; return h('div', { class: 'card' }, h('h4', { style: 'font-size:1rem' }, x.predict.q), h('p', null, 'Твой ответ: ' + (mine === 'yes' ? 'да' : 'нет') + (v ? ' · итог: ' + (v.outcome === 'yes' ? 'да' : v.outcome === 'no' ? 'нет' : 'неясно') + (v.outcome === mine ? ' · угадал' : ' · мимо') : ' · сверка ' + fmtDate(x.predict.horizon))), v && v.note ? h('p', null, v.note) : null); })) : h('p', { class: 'empty' }, 'Прогнозы появляются после вопроса в истории.')));
  el.append(h('p', { class: 'sync' }, (sync === 'cloud' ? 'Прогресс сохраняется в облаке страницы' : sync === 'readonly' ? 'Только чтение: прогресс не сохраняется' : 'Прогресс сохранён на этом устройстве') + ' · к повтору сегодня: ' + dueTerms().length + ' · основ пройдено: ' + Object.values(P.lib).filter(x => x.seen).length + ' из ' + allLib().length));
}
function techRow(t, d, n) { return h('div', null, h('b', null, t + (n ? ' · ' + n : '')), h('span', null, d)); }
function stat(v, l) { return h('div', { class: 'stat' }, h('b', null, v), h('span', null, l)); }
function nextRank(lv) { for (const [n, nm] of RANKS) if (n > lv) return nm + ' (уровень ' + n + ')'; return 'максимум'; }

/* ============ tabs + keys ============ */
function switchView(v) { for (const k of ['feed', 'map', 'me']) { $('#v-' + k).hidden = k !== v; $('#t-' + k).setAttribute('aria-selected', k === v); } if (v === 'map') renderMap(); if (v === 'me') renderMe(); }
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchView(t.dataset.v)));
document.addEventListener('keydown', e => {
  if ($('#v-feed').hidden || !$('#sheet').hidden) return;
  const i = Math.round(feed.scrollTop / feed.clientHeight), p = feed.querySelectorAll('.post')[i];
  if (e.key === 'ArrowDown') { e.preventDefault(); feed.scrollTo({ top: (i + 1) * feed.clientHeight, behavior: 'smooth' }); }
  if (e.key === 'ArrowUp') { e.preventDefault(); feed.scrollTo({ top: (i - 1) * feed.clientHeight, behavior: 'smooth' }); }
  if (p && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); const tr = p.querySelector('.slides'); tr.scrollBy({ left: (e.key === 'ArrowRight' ? 1 : -1) * tr.clientWidth, behavior: 'smooth' }); }
});

/* ============ boot ============ */
async function getJSON(u) { const r = await fetch(u, { cache: 'no-cache' }); if (!r.ok) throw new Error(u); return r.json(); }
async function load() {
  try { const idx = await getJSON('editions/index.json'); const eds = await Promise.all((idx.editions || []).map(d => getJSON('editions/' + d + '.json').then(e => Object.assign({ date: d }, e)).catch(() => null))); EDITIONS = eds.filter(Boolean).sort((a, b) => a.date < b.date ? 1 : -1); } catch (e) { EDITIONS = []; }
  try { const g = await getJSON('glossary.json'); buildGloss(g.items); } catch (e) { buildGloss([]); }
  try { const li = await getJSON('library/index.json'); const parts = await Promise.all((li.files || []).map(f => getJSON('library/' + f).catch(() => ({ cards: [] })))); LIB = parts.flatMap(p => p.cards || []).filter(validCard); } catch (e) { LIB = []; }
}
(async function boot() {
  hud();
  feed.append(carousel(h('article', { class: 'post', style: '--c:' + COL.intl }), [h('section', { class: 'slide' }, h('div', { class: 'body pad', style: 'justify-content:center' }, h('h2', { class: 'hero' }, 'Собираю ленту…')))]));
  await Promise.all([load(), connect()]);
  hud(); rebuild();
})();
})();
</script>
